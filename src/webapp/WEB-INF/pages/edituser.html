<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/resources/css/app.css}">
</head>
<body>
<main class="page-shell">
    <section class="panel form-panel">
        <div class="panel-header panel-header-compact">
            <div>
                <p class="eyebrow">Update record</p>
                <h1>Edit user</h1>
            </div>
            <a class="button button-secondary" th:href="@{/users}">Back to list</a>
        </div>

        <form class="form-grid" th:action="@{/users/edit}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}">

            <label class="field">
                <span>Name</span>
                <input type="text" th:field="*{name}">
                <small class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </label>

            <label class="field">
                <span>Surname</span>
                <input type="text" th:field="*{surname}">
                <small class="error-message" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></small>
            </label>

            <label class="field field-full">
                <span>Email</span>
                <input type="email" th:field="*{email}">
                <small class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </label>

            <div class="meta-row">
                <span th:text="${'Created: ' + user.createdAtFormatted}"></span>
                <span th:text="${'Updated: ' + user.updatedAtFormatted}"></span>
            </div>

            <div class="form-actions">
                <button class="button button-primary" type="submit">Save changes</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
